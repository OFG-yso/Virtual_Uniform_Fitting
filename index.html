<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>関西学院中学部 バーチャル制服試着</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #111; color: #fff; overflow: hidden;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  #app {
    position: fixed; inset: 0;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    flex: 0 0 auto;
    text-align: center;
    font-size: 15px; font-weight: 700;
    padding: 8px 8px 6px;
    background: #0b2a5b;
    letter-spacing: .03em;
  }
  #main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  #stage {
    position: relative; flex: 1 1 auto; min-height: 0; min-width: 0;
    overflow: hidden; background: #000;
    touch-action: none;
  }
  #video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; background: #000;
  }
  #video.mirror { transform: scaleX(-1); }
  #uniform {
    position: absolute; left: 0; top: 0;
    transform-origin: 50% 0;
    pointer-events: none;
    -webkit-user-drag: none;
    display: none;
  }
  #msg {
    position: absolute; left: 12px; right: 12px; top: 12px;
    background: rgba(0,0,0,.7); border-radius: 8px;
    padding: 10px 12px; font-size: 13px; line-height: 1.5; display: none;
  }
  #label {
    position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
    background: rgba(0,0,0,.55); border-radius: 14px;
    padding: 4px 12px; font-size: 13px; white-space: nowrap; pointer-events: none;
  }
  #zoomInfo {
    position: absolute; right: 8px; top: 8px;
    background: rgba(0,0,0,.55); border-radius: 10px;
    padding: 2px 8px; font-size: 12px; pointer-events: none;
  }
  #controls {
    flex: 0 0 auto;
    display: flex; flex-direction: row; align-items: center; justify-content: center;
    gap: 14px; padding: 10px 12px;
    background: #0b2a5b;
  }
  .btn {
    appearance: none; -webkit-appearance: none; border: none;
    background: #fff; color: #0b2a5b; font-size: 22px; font-weight: 700;
    width: 56px; height: 56px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
  }
  .btn:active { transform: scale(.94); opacity: .85; }
  .btn.small { width: 48px; height: 48px; font-size: 20px; }
  #shutter {
    width: 72px; height: 72px; background: #fff;
    border: 5px solid #c8d4ee; font-size: 0;
  }
  #shutter::after {
    content: ""; width: 46px; height: 46px; border-radius: 50%; background: #d4202a;
  }
  #flash {
    position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none;
    transition: opacity .25s;
  }
  /* 横長：コントロールを右側に縦並び */
  @media (orientation: landscape) {
    header { padding: 4px 8px; font-size: 13px; }
    #main { flex-direction: row; }
    #controls {
      flex-direction: column; padding: 8px 10px; gap: 10px;
      justify-content: center;
    }
    .btn { width: 48px; height: 48px; font-size: 20px; }
    .btn.small { width: 42px; height: 42px; font-size: 17px; }
    #shutter { width: 62px; height: 62px; border-width: 4px; }
    #shutter::after { width: 38px; height: 38px; }
  }
  @media (max-height: 420px) and (orientation: landscape) {
    #controls { gap: 6px; padding: 6px; }
    .btn { width: 40px; height: 40px; }
    .btn.small { width: 36px; height: 36px; }
    #shutter { width: 52px; height: 52px; }
    #shutter::after { width: 30px; height: 30px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>関西学院中学部 バーチャル制服試着</header>
  <div id="main">
    <div id="stage">
      <video id="video" autoplay playsinline muted></video>
      <img id="uniform" alt="制服" draggable="false">
      <div id="msg"></div>
      <div id="zoomInfo">1.0x</div>
      <div id="label"></div>
      <div id="flash"></div>
    </div>
    <div id="controls">
      <button class="btn" id="prev" aria-label="前の制服">◀</button>
      <button class="btn" id="shutter" aria-label="撮影"></button>
      <button class="btn" id="next" aria-label="次の制服">▶</button>
      <button class="btn small" id="switchCam" aria-label="カメラ切替">⟲</button>
    </div>
  </div>
</div>

<script>
(() => {
  // ===== 制服リスト（画像ファイルはHTMLと同じ階層の uniforms フォルダに置く） =====
  const UNIFORMS = [
    { name: "中学部男子冬服",         src: "uniforms/chu_boys_winter.png" },
    { name: "中学部男子夏服",         src: "uniforms/chu_boys_summer.png" },
    { name: "中学部女子冬服",         src: "uniforms/chu_girls_winter.png" },
    { name: "中学部女子冬服スラックス", src: "uniforms/chu_girls_winter_slacks.png" },
    { name: "中学部女子夏服",         src: "uniforms/chu_girls_summer.png" },
    { name: "高等部男子冬服",         src: "uniforms/kou_boys_winter.png" },
    { name: "高等部男子夏服",         src: "uniforms/kou_boys_summer.png" },
    { name: "高等部女子冬服",         src: "uniforms/kou_girls_winter.png" },
    { name: "高等部女子冬服スラックス", src: "uniforms/kou_girls_winter_slacks.png" },
    { name: "高等部女子夏服",         src: "uniforms/kou_girls_summer.png" },
  ];
  const MIN_SCALE = 0.2, MAX_SCALE = 8;

  const stage = document.getElementById('stage');
  const video = document.getElementById('video');
  const img = document.getElementById('uniform');
  const msg = document.getElementById('msg');
  const label = document.getElementById('label');
  const zoomInfo = document.getElementById('zoomInfo');
  const flash = document.getElementById('flash');

  let index = 0;
  let scale = 1;
  let facing = 'environment';   // スマホはアウトカメラが既定
  let stream = null;

  // ===== 制服表示 =====
  function showMsg(t) { msg.textContent = t; msg.style.display = t ? 'block' : 'none'; }

  function baseSize() {
    const W = stage.clientWidth, H = stage.clientHeight;
    const aw = img.naturalWidth || 1, ah = img.naturalHeight || 1;
    let h = H * 0.96, w = h * aw / ah;
    if (w > W * 0.96) { w = W * 0.96; h = w * ah / aw; }
    return { w, h, top: (H - h) / 2 };
  }

  function layout() {
    if (!img.naturalWidth) return;
    const W = stage.clientWidth;
    const b = baseSize();
    img.style.width = b.w + 'px';
    img.style.height = b.h + 'px';
    // 画像上部中央（顔の位置）を固定点とし、そこを中心に拡縮
    img.style.left = (W / 2 - b.w / 2) + 'px';
    img.style.top = b.top + 'px';
    img.style.transform = `scale(${scale})`;
    zoomInfo.textContent = scale.toFixed(1) + 'x';
  }

  function loadUniform(i) {
    index = (i + UNIFORMS.length) % UNIFORMS.length;
    const u = UNIFORMS[index];
    label.textContent = `${index + 1}/${UNIFORMS.length}　${u.name}`;
    img.style.display = 'none';
    img.onload = () => { img.style.display = 'block'; showMsg(''); layout(); };
    img.onerror = () => {
      img.style.display = 'none';
      showMsg(`制服画像が見つかりません：${u.src}`);
    };
    img.removeAttribute('src');
    img.src = u.src;
  }

  document.getElementById('prev').onclick = () => loadUniform(index - 1);
  document.getElementById('next').onclick = () => loadUniform(index + 1);

  // ===== カメラ =====
  async function startCamera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showMsg('このブラウザではカメラを利用できません。HTTPSでアクセスしてください。');
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play().catch(() => {});
      const s = stream.getVideoTracks()[0].getSettings();
      const actual = s.facingMode || facing;
      video.classList.toggle('mirror', actual === 'user');
      video._mirror = (actual === 'user');
    } catch (e) {
      showMsg('カメラを起動できませんでした。カメラの使用を許可してください。(' + (e.name || e) + ')');
    }
  }
  document.getElementById('switchCam').onclick = () => {
    facing = (facing === 'environment') ? 'user' : 'environment';
    startCamera();
  };

  // ===== ピンチ操作（画像上部中央が中心） =====
  const pointers = new Map();
  let startDist = 0, startScale = 1;
  const dist = () => {
    const [a, b] = [...pointers.values()];
    return Math.hypot(a.x - b.x, a.y - b.y);
  };
  function setScale(s) {
    scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, s));
    layout();
  }
  stage.addEventListener('pointerdown', e => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    if (pointers.size === 2) { startDist = dist(); startScale = scale; }
  });
  stage.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2 && startDist > 0) setScale(startScale * dist() / startDist);
  });
  const up = e => { pointers.delete(e.pointerId); if (pointers.size < 2) startDist = 0; };
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);
  // iOS Safari のジェスチャによるページ拡大を防止
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t =>
    document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  // PC：ホイールで拡縮
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    setScale(scale * Math.exp(-e.deltaY * 0.0015));
  }, { passive: false });

  // ===== 撮影・ダウンロード =====
  document.getElementById('shutter').onclick = () => {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) { showMsg('カメラの映像がまだ取得できていません。'); return; }
    const W = stage.clientWidth, H = stage.clientHeight;
    const k = Math.max(W / vw, H / vh);          // 映像1pxあたりのCSS px（object-fit: cover）
    const cw = Math.round(W / k), ch = Math.round(H / k);
    const canvas = document.createElement('canvas');
    canvas.width = cw; canvas.height = ch;
    const ctx = canvas.getContext('2d');

    // 映像（coverで切り出し）
    const sw = cw, sh = ch;
    const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
    ctx.save();
    if (video._mirror) { ctx.translate(cw, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
    ctx.restore();

    // 制服
    if (img.style.display !== 'none' && img.naturalWidth) {
      const b = baseSize();
      const w = b.w * scale / k, h = b.h * scale / k;
      const x = (W / 2) / k - w / 2;
      const y = b.top / k;
      ctx.drawImage(img, x, y, w, h);
    }

    flash.style.opacity = '0.8';
    setTimeout(() => flash.style.opacity = '0', 120);

    canvas.toBlob(blob => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const d = new Date(), p = n => String(n).padStart(2, '0');
      const a = document.createElement('a');
      a.href = url;
      a.download = `seifuku_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }, 'image/png');
  };

  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 200));
  if (window.ResizeObserver) new ResizeObserver(layout).observe(stage);

  loadUniform(0);
  startCamera();
})();
</script>
</body>
</html>
